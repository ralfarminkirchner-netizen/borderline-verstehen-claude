<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Borderline verstehen · Fugenland</title>
<meta name="description" content="Ein Feld, das von seinen Fugen getragen wird: Übersetzung, Gegenhalt, Schwelle, Überschneidung, Fehlstelle, Herkunft – jede anders gebaut, jede anders bedienbar, alle aus dem Atlasbestand.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cpath d=%22M4 6l10 2-3 8 4 10-11 0z%22 fill=%22%235d554b%22/%3E%3Cpath d=%22M28 6l-10 2 3 8-4 10 11 0z%22 fill=%22%238b7e6c%22/%3E%3C/svg%3E">
<link rel="stylesheet" href="/fugenland.css">
</head>
<body>
<div id="app" class="app" data-ebene="feld">
  <main id="feld" class="feld" aria-label="Fugenfeld">
    <canvas id="feld-bild" class="feld-bild" tabindex="0" role="application"
      aria-label="Fugenfeld. Pfeiltasten verschieben, Plus und Minus zoomen. Die Fugenorte sind über die Liste und die Legende mit der Tabulatortaste erreichbar."
      aria-describedby="feld-status"></canvas>
    <p id="feld-status" class="nur-vorlesen" aria-live="polite"></p>
    <div id="feld-schild" class="feld-schild" hidden></div>
  </main>

  <header class="kopf">
    <a class="marke" href="#/feld">
      <span class="marke-titel">Fugenland</span>
      <span class="marke-unter">Borderline verstehen · Claude-Fassung</span>
    </a>
    <nav id="pfad" class="pfad" aria-label="Wo du bist"></nav>
    <div class="suche" role="search">
      <label for="suche" class="nur-vorlesen">Ort finden</label>
      <input id="suche" type="search" placeholder="Ort finden …" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="false" aria-controls="treffer" aria-autocomplete="list">
      <ul id="treffer" class="treffer" role="listbox" aria-label="Gefundene Orte" hidden></ul>
    </div>
    <div class="kopf-werkzeug">
      <button id="liste-knopf" type="button" class="knopf leise" aria-pressed="false">Als Liste</button>
      <button id="bewegung-knopf" type="button" class="knopf leise" aria-pressed="false">Bewegung an</button>
      <span id="speicher-stand" class="speicher-stand" role="status" aria-live="polite"></span>
    </div>
  </header>

  <aside id="legende" class="legende" aria-label="Fugenarten im Feld"></aside>

  <section id="liste" class="liste" aria-label="Alle Fugenorte als Liste" hidden></section>

  <section id="raum" class="raum" aria-labelledby="raum-titel" hidden>
    <div class="raum-kopf">
      <button id="raum-zurueck" type="button" class="knopf zurueck">← Zum Feld</button>
      <div class="raum-kennung">
        <p id="raum-art" class="raum-art"></p>
        <h1 id="raum-titel" class="raum-titel" tabindex="-1"></h1>
      </div>
      <button id="schicht-knopf" type="button" class="knopf leise schicht-knopf" aria-pressed="false" aria-controls="raum-schicht">Herkunft und Geltung</button>
      <div class="raum-wechsel" role="group" aria-label="Fall wechseln">
        <button id="raum-vor" type="button" class="knopf leise" aria-label="Voriger Fall">‹</button>
        <span id="raum-zahl" class="raum-zahl"></span>
        <button id="raum-nach" type="button" class="knopf leise" aria-label="Nächster Fall">›</button>
      </div>
    </div>
    <div id="raum-urteil" class="raum-urteil" hidden></div>
    <div id="raum-buehne" class="raum-buehne"></div>
    <div id="raum-schicht" class="raum-schicht"></div>
  </section>

  <section id="hand" class="hand" aria-label="Orte in der Hand" hidden></section>
  <section id="spieler" class="spieler" aria-label="Spieler" hidden></section>

  <dialog id="original" class="original" aria-labelledby="original-titel">
    <div class="original-kopf">
      <h2 id="original-titel"></h2>
      <button type="button" class="knopf" data-schliessen>Zurück in den Raum</button>
    </div>
    <div id="original-text" class="original-text"></div>
  </dialog>
</div>
<script type="module" src="/fl/app.mjs"></script>
</body>
</html>
