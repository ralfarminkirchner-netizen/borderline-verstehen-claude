    <text style="fill: #53616b; font: 11px 'DejaVu Sans'; text-anchor: middle" x="410.76" y="305.107712" transform="rotate(-0 410.76 305.107712)">Kein Begriff erschöpft die Person.</text>
   </g>
   <g id="text_13">
    <text style="fill: #53616b; font: 10.5px 'DejaVu Sans'" transform="translate(35.784 482.515589)">Die gestrichelten Linien bedeuten: gemeinsam befragen. Sie behaupten weder Gleichheit noch eine bewiesene Ursache.</text>
    <text style="fill: #53616b; font: 10.5px 'DejaVu Sans'" transform="translate(35.784 496.6668)">Die Unterscheidungen, Quellen und historischen Diagnosegrenzen stehen im Kapitel „Rollen, Normen und diagnostische Grenzen“.</text>
   </g>
