   <g id="text_1">
    <text style="fill: #173d42; font: 25px 'DejaVu Serif'; text-anchor: start" x="31.878" y="49.135294" transform="rotate(-0 31.878 49.135294)">Vier Fragen an dieselbe Situation</text>
   </g>
   <g id="text_2">
    <text style="fill: #53616b; font: 11px 'DejaVu Sans'; text-anchor: start" x="31.878" y="65.0664" transform="rotate(-0 31.878 65.0664)">Begriffe zusammen lesen, ohne sie gleichzusetzen. Konzeptuelle Orientierung, kein getestetes Wirkmodell.</text>
   </g>
   <g id="text_3">
    <text style="fill: #173d42; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="55.314" y="136.554525" transform="rotate(-0 55.314 136.554525)">Als wer handle ich hier?</text>
   </g>
   <g id="text_4">
    <text style="fill: #173d42; font: 10.5px 'DejaVu Sans'" transform="translate(55.314 162.857559)">Rolle und Perspektive</text>
    <text style="fill: #173d42; font: 10.5px 'DejaVu Sans'" transform="translate(55.314 177.00877)">Zum Beispiel als Kollegin, Freund oder Lernender.</text>
    <text style="fill: #173d42; font: 10.5px 'DejaVu Sans'" transform="translate(55.314 191.159981)">Ein situativer Bezug beschreibt nicht die ganze Person.</text>
   </g>
   <g id="text_5">
    <text style="fill: #946218; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="469.35" y="136.554525" transform="rotate(-0 469.35 136.554525)">Welcher Maßstab gilt?</text>
   </g>
   <g id="text_6">
    <text style="fill: #173d42; font: 10.5px 'DejaVu Sans'" transform="translate(469.35 162.857559)">Norm und Entscheidungsmacht</text>
    <text style="fill: #173d42; font: 10.5px 'DejaVu Sans'" transform="translate(469.35 177.00877)">Wer legt Tempo, Kommunikation und Leistung fest?</text>
    <text style="fill: #173d42; font: 10.5px 'DejaVu Sans'" transform="translate(469.35 191.159981)">Statistik, soziale Erwartung und Diagnose trennen.</text>
   </g>
   <g id="text_7">
    <text style="fill: #a55038; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="55.314" y="361.086525" transform="rotate(-0 55.314 361.086525)">Was wird verborgen oder kompensiert?</text>
   </g>
   <g id="text_8">
    <text style="fill: #173d42; font: 10.5px 'DejaVu Sans'" transform="translate(55.314 387.389559)">Masking und Camouflaging</text>
    <text style="fill: #173d42; font: 10.5px 'DejaVu Sans'" transform="translate(55.314 401.54077)">Welche Merkmale werden überspielt, wie und warum?</text>
    <text style="fill: #173d42; font: 10.5px 'DejaVu Sans'" transform="translate(55.314 415.691981)">Das ist nicht automatisch jede Rollenübernahme.</text>
   </g>
   <g id="text_9">
    <text style="fill: #315b82; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="469.35" y="361.255275" transform="rotate(-0 469.35 361.255275)">Was erschwert oder ermöglicht Teilhabe?</text>
   </g>
   <g id="text_10">
    <text style="fill: #173d42; font: 10.5px 'DejaVu Sans'" transform="translate(469.35 387.389559)">Barrieren und Unterstützung</text>
    <text style="fill: #173d42; font: 10.5px 'DejaVu Sans'" transform="translate(469.35 401.54077)">Welche Bedingung lässt sich konkret verändern?</text>
    <text style="fill: #173d42; font: 10.5px 'DejaVu Sans'" transform="translate(469.35 415.691981)">Zugang und Wohlbefinden getrennt überprüfen.</text>
   </g>
