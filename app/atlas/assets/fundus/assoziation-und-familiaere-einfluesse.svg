   <g id="text_1">
    <text style="fill: #173d42; font: 23px 'DejaVu Serif'; text-anchor: start" x="31.041" y="51.085756" transform="rotate(-0 31.041 51.085756)">Wenn ein Zusammenhang seine Bedeutung ändert</text>
   </g>
   <g id="text_2">
    <text style="fill: #53616b; font: 11px 'DejaVu Sans'; text-anchor: start" x="31.041" y="64.512" transform="rotate(-0 31.041 64.512)">Ein Beispiel zum Lesen von Beobachtungsstudien – kein vollständiges Modell für ADHS.</text>
   </g>
   <g id="text_3">
    <text style="fill: #a55038; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="60.057" y="151.246125" transform="rotate(-0 60.057 151.246125)">Exposition</text>
   </g>
   <g id="text_4">
    <text style="fill: #173d42; font: 10.5px 'DejaVu Sans'" transform="translate(60.057 174.499959)">Zum Beispiel Rauchen</text>
    <text style="fill: #173d42; font: 10.5px 'DejaVu Sans'" transform="translate(60.057 188.65117)">in der Schwangerschaft</text>
   </g>
   <g id="text_5">
    <text style="fill: #315b82; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="495.297" y="151.414875" transform="rotate(-0 495.297 151.414875)">Späteres Ergebnis</text>
   </g>
   <g id="text_6">
    <text style="fill: #173d42; font: 10.5px 'DejaVu Sans'" transform="translate(495.297 174.499959)">Zum Beispiel eine</text>
    <text style="fill: #173d42; font: 10.5px 'DejaVu Sans'" transform="translate(495.297 188.65117)">ADHS-Diagnose</text>
   </g>
   <g id="text_7">
    <text style="fill: #946218; font: 10px 'DejaVu Sans'; text-anchor: middle" x="382.86" y="164.304" transform="rotate(-0 382.86 164.304)">beobachtete Assoziation</text>
   </g>
   <g id="text_8">
    <text style="fill: #173d42; font: 700 12px 'DejaVu Sans'; text-anchor: start" x="255.915" y="337.524525" transform="rotate(-0 255.915 337.524525)">Gemeinsame familiäre Einflüsse</text>
   </g>
   <g id="text_9">
    <text style="fill: #173d42; font: 10.5px 'DejaVu Sans'" transform="translate(255.915 360.778359)">Genetische und soziale Faktoren</text>
    <text style="fill: #173d42; font: 10.5px 'DejaVu Sans'" transform="translate(255.915 374.92957)">können mit beiden Größen</text>
    <text style="fill: #173d42; font: 10.5px 'DejaVu Sans'" transform="translate(255.915 389.080781)">zusammenhängen.</text>
   </g>
   <g id="text_10">
    <text style="fill: #53616b; font: 11px 'DejaVu Sans'" transform="translate(34.668 442.202122)">Geschwistervergleiche können geteilte Einflüsse teilweise kontrollieren. Sie beseitigen nicht jede Verzerrung.</text>
    <text style="fill: #53616b; font: 11px 'DejaVu Sans'" transform="translate(34.668 457.0272)">Ein schwächerer Zusammenhang verlangt eine engere Erklärung; er beweist nicht, dass Umwelt unwichtig ist.</text>
   </g>
